name: .NET 8 CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Run Automated Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore WarehouseReserveSystem.sln

    - name: Build solution (Release)
      run: dotnet build WarehouseReserveSystem.sln --no-restore --configuration Release

    - name: Execute automated unit & integration tests
      run: dotnet test WarehouseReserveSystem.sln --no-build --configuration Release --verbosity normal
